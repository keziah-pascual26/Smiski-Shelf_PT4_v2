<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/pages/register/register.css">
</head>
<body>
    <div class="register-container">
        <h1 class="register-title">User Registration</h1>
        <form id="register-form" class="form-container">
            <div class="input-group">
                <span class="icon">👤</span>
                <input type="text" id="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <span class="icon">✉️</span>
                <input type="email" id="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <span class="icon">🔒</span>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <div class="input-group">
                <span class="icon">🔒</span>
                <input type="password" id="confirm-password" placeholder="Confirm Password" required>
            </div>
            <button type="submit" class="register-btn">Sign-up</button>
        </form>

        <p id="message"></p>

        <!-- Go to Login Button -->
        <button id="go-to-login" class="login-btn" onclick="window.location.href='/pages/login/login.html'">
            Go to Login
        </button>
    </div>

    <script src="/pages/register/register.js"></script>
</body>
</html>
