<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/pages/login/login.css">
</head>
<body>
    <h1>Login</h1>
    
    <form id="login-form">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <!-- Add Google Login Button -->
    <div class="google-login">
        <a href="http://localhost:3000/auth/google" class="google-btn">
            Login with Google
        </a>
    </div>

    <p><a href="/pages/reset-password/reset.html">Forgot Password?</a></p>
    <button onclick="window.location.href='/pages/register/register.html'">Sign up</button>

    <script src="/pages/login/login.js"></script>
</body>
</html>
