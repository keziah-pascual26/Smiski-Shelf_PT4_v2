<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/pages/login/login.css">
</head>
<body>
    <div class="login-container">
        <h1 class="welcome-text">WELCOME</h1>
        
        <form id="login-form" class="form-container">
            <div class="input-group">
                <label for="email">
                    <span class="icon">👤</span>
                    <input type="email" id="email" placeholder="Username" required>
                </label>
            </div>
            <div class="input-group">
                <label for="password">
                    <span class="icon">🔒</span>
                    <input type="password" id="password" placeholder="Password" required>
                </label>
            </div>
            <div class="form-links">
                <a href="/pages/register/register.html">Don't have an account?</a>
                <a href="/pages/reset-password/reset.html">Forgot Password?</a>
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>
    
        <!-- Separator -->
        <div class="separator">
            <span>OR</span>
        </div>
    
        <!-- Google Login Button -->
        <div class="google-login">
            <a href="http://localhost:3000/auth/google" class="google-btn">
                Login with Google
            </a>
        </div>
    </div>

    <script src="/pages/login/login.js"></script>
</body>
</html>
