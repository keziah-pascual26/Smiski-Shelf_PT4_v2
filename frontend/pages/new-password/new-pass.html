<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password</title>
    <link rel="stylesheet" href="/pages/reset-password/reset.css">
</head>
<body>
    <div class="reset-container">
        <img src="img/smiski-reset.png" alt="Smiski Reset" class="reset-image">
        <h1 class="reset-title">Set New Password</h1>
        <form id="new-pass-form" class="reset-form">
            <div class="input-group">
                <span class="icon">🔒</span>
                <input type="password" id="new-password" placeholder="Enter new password" required>
            </div>
            <input type="hidden" id="reset-token">
            <button type="submit" class="reset-btn">Update Password</button>
        </form>
        <button class="back-btn" onclick="window.location.href='../login/login.html'">Back to Login</button>
    </div>
    <script src="/pages/new-password/new-pass.js"></script>
</body>
</html>
